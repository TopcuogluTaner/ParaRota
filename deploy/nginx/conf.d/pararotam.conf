# SignalR / WebSocket upgrade haritası
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream pararota_api {
    server api:8080;
}

# HTTP → HTTPS yönlendirme (+ ACME http-01 fallback yolu)
server {
    listen 80;
    listen [::]:80;
    server_name api.pararotam.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — API reverse proxy
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.pararotam.com;

    ssl_certificate     /etc/letsencrypt/live/api.pararotam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pararotam.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Fiş/görsel upload — istemci 1600px'e küçültüyor ama ham fallback (küçültme
    # hatası) + web yüklemeleri için pay bırak.
    client_max_body_size 25m;

    # SignalR hub — kalıcı WebSocket/SSE: uzun timeout + buffering kapalı
    # (idle kopma "Server timeout" + SSE/long-polling fallback bozulması fix).
    location /hubs/ {
        proxy_pass http://pararota_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        proxy_pass http://pararota_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SignalR / WebSocket (/hubs/notifications)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 100s;
    }
}
