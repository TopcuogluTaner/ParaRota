services:
  postgres:
    image: postgres:16
    container_name: pararota-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pararota
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pararota-pgdata:/var/lib/postgresql/data

volumes:
  pararota-pgdata:
