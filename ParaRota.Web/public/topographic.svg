<svg xmlns="http://www.w3.org/2000/svg" width="980" height="980" viewBox="0 0 980 980" fill="none">
  <defs>
    <pattern id="grid" x="0" y="0" width="980" height="980" patternUnits="userSpaceOnUse">
      <g stroke="currentColor" stroke-width="0.6" fill="none" opacity="0.45">
        <path d="M-100,260 C160,220 320,300 540,250 C720,210 880,290 1080,250" />
        <path d="M-100,320 C170,275 340,360 560,310 C740,265 900,350 1080,310" />
        <path d="M-100,380 C180,335 360,420 580,370 C760,320 920,410 1080,370" />
        <path d="M-100,440 C200,395 380,480 600,430 C780,380 940,470 1080,430" />
        <path d="M-100,500 C220,460 400,540 620,490 C800,440 960,530 1080,490" />
        <path d="M-100,580 C190,540 380,620 600,580 C780,540 940,610 1080,580" />
        <path d="M-100,660 C170,620 360,700 580,660 C760,620 920,690 1080,660" />
        <path d="M-100,740 C150,700 340,780 560,740 C740,700 900,770 1080,740" />
        <path d="M-100,820 C130,790 320,860 540,820 C720,790 880,850 1080,820" />
      </g>

      <!-- Concentric "waypoint" rings -->
      <g stroke="currentColor" stroke-width="0.5" fill="none" opacity="0.35">
        <circle cx="780" cy="180" r="22" />
        <circle cx="780" cy="180" r="40" />
        <circle cx="780" cy="180" r="62" />
      </g>
      <g stroke="currentColor" stroke-width="0.5" fill="none" opacity="0.32">
        <circle cx="180" cy="780" r="18" />
        <circle cx="180" cy="780" r="34" />
        <circle cx="180" cy="780" r="54" />
      </g>

      <!-- Cardinal markers -->
      <g fill="currentColor" opacity="0.45">
        <circle cx="780" cy="180" r="2.5" />
        <circle cx="180" cy="780" r="2.5" />
      </g>

      <!-- Tiny crosshair tickmarks -->
      <g stroke="currentColor" stroke-width="0.4" opacity="0.3">
        <line x1="120" y1="120" x2="135" y2="120" />
        <line x1="127.5" y1="113" x2="127.5" y2="127" />
        <line x1="860" y1="860" x2="875" y2="860" />
        <line x1="867.5" y1="853" x2="867.5" y2="867" />
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" color="#7E6A3B"/>
</svg>
